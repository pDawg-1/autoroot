name: Weekly sales monitoring
on:
  schedule:
    - cron: '30 13 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python pipeline.py
      - uses: actions/upload-artifact@v4
        with:
          name: weekly-investigations
          path: reports/
          retention-days: 30
