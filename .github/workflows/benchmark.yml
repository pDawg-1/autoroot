name: Reproduce frozen holdout
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python benchmark.py
      - run: python -m pytest tests/test_ingestion_decisions.py -q
      - uses: actions/upload-artifact@v4
        with:
          name: frozen-holdout-results
          path: reports/benchmark/
